# Render Blueprint: New → Blueprint → pick this repo. Then paste GEMINI_API_KEY when Render asks.
services:
  - type: web
    name: qabas
    runtime: docker
    plan: free
    # No HTTP health check on purpose: on the free plan (0.1 CPU) processing a lesson can delay an answer past
    # Render's 5-second check, and Render then restarts the server and kills the lesson being processed.
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # secret: entered in the Render dashboard, never in the repo
      - key: MAX_LESSONS_PER_DAY
        value: "5"             # budget: new lessons per day on the public link
      - key: MAX_LESSON_MINUTES
        value: "10"
      - key: SHOW_SAMPLE
        value: "0"
